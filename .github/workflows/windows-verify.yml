name: Windows verify

on:
  workflow_dispatch:
  push:
    branches: [ master, main ]
  pull_request:

jobs:
  build-and-self-test:
    runs-on: windows-latest
    timeout-minutes: 25
    env:
      WTA_CI: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Build, publish and run self-test
        shell: cmd
        run: Build.cmd

      - name: Upload verified portable build
        uses: actions/upload-artifact@v4
        with:
          name: WTAssistant-Windows-verified
          path: Builds/WTAssistant/**
          if-no-files-found: error

      - name: Verify controller inputs and repeat timing
        shell: pwsh
        run: |
          dotnet publish Tests/ControlsInput.Tests/ControlsInput.Tests.csproj -c Release -p:Platform=x86 -r win-x86 --self-contained true -o artifacts/controls-tests
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & ./artifacts/controls-tests/ControlsInput.Tests.exe
          exit $LASTEXITCODE

      - name: Verify Neck Assistant speed and localized layouts
        shell: pwsh
        run: |
          dotnet publish Tests/NeckSpeed.Tests/NeckSpeed.Tests.csproj -c Release -p:Platform=x86 -r win-x86 --self-contained true -o artifacts/neck-speed-tests
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & ./artifacts/neck-speed-tests/NeckSpeed.Tests.exe
          exit $LASTEXITCODE
